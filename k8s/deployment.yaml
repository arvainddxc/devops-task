apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: test-app
        image: 695466865413.dkr.ecr.ap-southeast-1.amazonaws.com/test-repo:latest
        ports:
        - containerPort: 3000
